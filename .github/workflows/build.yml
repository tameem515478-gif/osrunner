name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q project.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Download proot
        run: |
          curl -L -o proot.tar.gz https://github.com/green-green-avk/build-proot-android/raw/master/packages/proot-android-aarch64.tar.gz
          mkdir pr && tar xzf proot.tar.gz -C pr
          find pr -type f
          D=proj/app/src/main/jniLibs/arm64-v8a
          mkdir -p $D
          cp "$(find pr -path '*/bin/proot' -type f | head -1)" $D/libproot.so
          cp "$(find pr -name loader -type f | head -1)" $D/libproot-loader.so
          ls -l $D
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: proj/app/build/outputs/apk/debug/app-debug.apk
